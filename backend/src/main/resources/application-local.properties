# Run without Docker/PostgreSQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# In-memory H2 in PostgreSQL mode; the same Flyway migrations are applied.
spring.datasource.url=jdbc:h2:mem:astra;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
