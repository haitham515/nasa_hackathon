spring.application.name=astra-backend
server.port=${PORT:8080}

# PostgreSQL (default; Docker Compose overrides via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/astra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:astra}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:astra}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Long-lived SSE connections should not time out.
spring.mvc.async.request-timeout=-1

astra.ai-url=${ASTRA_AI_URL:http://localhost:8000}
astra.cors-origins=${ASTRA_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info
